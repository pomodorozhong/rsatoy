name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ldflags="-s -w -X main.version=${TAG#v}"
          mkdir -p dist

          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o dist/rsatoy-windows-amd64.exe ./cmd/rsatoy

          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o dist/rsatoy-macos-arm64 ./cmd/rsatoy
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o dist/rsatoy-macos-amd64 ./cmd/rsatoy

          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "rsatoy $TAG" --generate-notes --verify-tag
