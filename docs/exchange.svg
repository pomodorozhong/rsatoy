<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="540" viewBox="0 0 1380 540" role="img">
<title>rsatoy exchange as a swimlane</title>
<desc>Three lanes, recipient, between the two people, and sender, across six steps. Each step column names the command, the channel it needs, and whether anything secret is sent.</desc>
<style>
.bg{fill:#fff} text{font-family:-apple-system,"Segoe UI",system-ui,sans-serif;fill:#2c2c2a}
.title{font-size:15px;font-weight:600} .cmd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;fill:#444441}
.note{font-size:12px;fill:#5f5e5a} .small{font-size:12px} .lane-label{font-size:14px;font-weight:600}
.lane-a{fill:#f7f6f2} .lane-b{fill:#efede6} .grid{stroke:#d3d1c7;stroke-width:1}
.action{fill:#fff;stroke:#888780;stroke-width:1}
.card-none{fill:#f1efe8;stroke:#b4b2a9} .card-un{fill:#eaf3de;stroke:#97c459} .card-tr{fill:#fcebeb;stroke:#f09595}
.badge-none{fill:#d3d1c7} .badge-un{fill:#c0dd97} .badge-tr{fill:#f7c1c1} .badge-text{font-size:11px;font-weight:600}
.num-text{font-size:20px;font-weight:700;fill:#fff} .num-none{fill:#5f5e5a} .num-un{fill:#3b6d11} .num-tr{fill:#a32d2d}
.item-un{fill:#eaf3de;stroke:#3b6d11;stroke-width:1.5} .item-tr{fill:#fcebeb;stroke:#a32d2d;stroke-width:1.5;stroke-dasharray:6 4}
.arr-un{stroke:#3b6d11;stroke-width:2;fill:none} .arr-tr{stroke:#a32d2d;stroke-width:2;fill:none;stroke-dasharray:6 4}
.head-un{fill:#3b6d11} .head-tr{fill:#a32d2d}
@media (prefers-color-scheme: dark){
.bg{fill:#1f1f1e} text{fill:#f1efe8} .cmd{fill:#d3d1c7} .note{fill:#b4b2a9}
.lane-a{fill:#262625} .lane-b{fill:#2c2c2a} .grid{stroke:#444441}
.action{fill:#1f1f1e;stroke:#888780}
.card-none{fill:#2c2c2a;stroke:#5f5e5a} .card-un{fill:#173404;stroke:#639922} .card-tr{fill:#501313;stroke:#a32d2d}
.badge-none{fill:#444441} .badge-un{fill:#3b6d11} .badge-tr{fill:#791f1f}
.num-none{fill:#888780} .num-un{fill:#639922} .num-tr{fill:#e24b4a}
.item-un{fill:#173404;stroke:#97c459} .item-tr{fill:#501313;stroke:#f09595}
.arr-un{stroke:#97c459} .arr-tr{stroke:#f09595} .head-un{fill:#97c459} .head-tr{fill:#f09595}}
</style>
<defs>
<marker id="h-un" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-un" d="M0 0L10 5L0 10z"/></marker>
<marker id="h-tr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-tr" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1380" height="540"/>
<rect class="card-none" x="20" y="16" width="16" height="16" rx="3"/><text class="small" x="44" y="29">Nothing is sent</text>
<rect class="card-un" x="170" y="16" width="16" height="16" rx="3"/><text class="small" x="194" y="29">Low risk: untrusted channel is fine (email, chat)</text>
<rect class="card-tr" x="520" y="16" width="16" height="16" rx="3"/><text class="small" x="544" y="29">Needs care: trusted channel needed (call, in person)</text>
<line class="arr-un" x1="900" y1="24" x2="950" y2="24" marker-end="url(#h-un)"/><text class="small" x="958" y="29">untrusted</text>
<line class="arr-tr" x1="1040" y1="24" x2="1090" y2="24" marker-end="url(#h-tr)"/><text class="small" x="1098" y="29">trusted</text>
<rect class="lane-a" x="20" y="180" width="1340" height="110"/>
<text class="lane-label" x="34" y="233">Recipient</text><text class="note" x="34" y="251">(friend)</text>
<rect class="lane-b" x="20" y="290" width="1340" height="110"/>
<text class="lane-label" x="34" y="343">Between you</text><text class="note" x="34" y="361">(what is sent)</text>
<rect class="lane-a" x="20" y="400" width="1340" height="110"/>
<text class="lane-label" x="34" y="453">Sender</text><text class="note" x="34" y="471">(you)</text>
<line class="grid" x1="20" y1="180" x2="1360" y2="180"/>
<line class="grid" x1="20" y1="290" x2="1360" y2="290"/>
<line class="grid" x1="20" y1="400" x2="1360" y2="400"/>
<line class="grid" x1="20" y1="510" x2="1360" y2="510"/>
<line class="grid" x1="160" y1="180" x2="160" y2="510"/>
<line class="grid" x1="360" y1="180" x2="360" y2="510"/>
<line class="grid" x1="560" y1="180" x2="560" y2="510"/>
<line class="grid" x1="760" y1="180" x2="760" y2="510"/>
<line class="grid" x1="960" y1="180" x2="960" y2="510"/>
<line class="grid" x1="1160" y1="180" x2="1160" y2="510"/>
<line class="grid" x1="1360" y1="180" x2="1360" y2="510"/>
<rect class="card-none" x="166" y="50" width="188" height="120" rx="8"/>
<circle class="num-none" cx="194" cy="76" r="17"/><text class="num-text" x="194" y="83" text-anchor="middle">1</text><text class="title" x="220" y="81">Make keys</text>
<text class="cmd" x="176" y="110">rsatoy init --bits 3072</text>
<rect class="badge-none" x="176" y="120" width="90" height="20" rx="10"/><text class="badge-text" x="221.0" y="134" text-anchor="middle">No channel</text>
<text class="note" x="176" y="159">Nothing leaves the computer</text>
<rect class="card-un" x="366" y="50" width="188" height="120" rx="8"/>
<circle class="num-un" cx="394" cy="76" r="17"/><text class="num-text" x="394" y="83" text-anchor="middle">2</text><text class="title" x="420" y="81">Send public key</text>
<text class="cmd" x="376" y="110">rsatoy pubkey</text>
<rect class="badge-un" x="376" y="120" width="110" height="20" rx="10"/><text class="badge-text" x="431.0" y="134" text-anchor="middle">Untrusted OK</text>
<text class="note" x="376" y="159">Not secret, checked in step 3</text>
<rect class="card-tr" x="566" y="50" width="188" height="120" rx="8"/>
<circle class="num-tr" cx="594" cy="76" r="17"/><text class="num-text" x="594" y="83" text-anchor="middle">3</text><text class="title" x="620" y="81">Check fingerprint</text>
<text class="cmd" x="576" y="110">rsatoy encrypt friend.pub</text>
<rect class="badge-tr" x="576" y="120" width="124" height="20" rx="10"/><text class="badge-text" x="638.0" y="134" text-anchor="middle">Trusted needed</text>
<text class="note" x="576" y="159">Not secret</text>
<rect class="card-un" x="766" y="50" width="188" height="120" rx="8"/>
<circle class="num-un" cx="794" cy="76" r="17"/><text class="num-text" x="794" y="83" text-anchor="middle">4</text><text class="title" x="820" y="81">Send the secret</text>
<text class="cmd" x="776" y="110">same encrypt run</text>
<rect class="badge-un" x="776" y="120" width="110" height="20" rx="10"/><text class="badge-text" x="831.0" y="134" text-anchor="middle">Untrusted OK</text>
<text class="note" x="776" y="159">Secret, but encrypted</text>
<rect class="card-none" x="966" y="50" width="188" height="120" rx="8"/>
<circle class="num-none" cx="994" cy="76" r="17"/><text class="num-text" x="994" y="83" text-anchor="middle">5</text><text class="title" x="1020" y="81">Decrypt</text>
<text class="cmd" x="976" y="110">rsatoy decrypt</text>
<rect class="badge-none" x="976" y="120" width="90" height="20" rx="10"/><text class="badge-text" x="1021.0" y="134" text-anchor="middle">No channel</text>
<text class="note" x="976" y="159">Secret goes to clipboard</text>
<rect class="card-tr" x="1166" y="50" width="188" height="120" rx="8"/>
<circle class="num-tr" cx="1194" cy="76" r="17"/><text class="num-text" x="1194" y="83" text-anchor="middle">6</text><text class="title" x="1220" y="81">Confirm sender</text>
<text class="cmd" x="1176" y="110">no command</text>
<rect class="badge-tr" x="1176" y="120" width="124" height="20" rx="10"/><text class="badge-text" x="1238.0" y="134" text-anchor="middle">Trusted needed</text>
<text class="note" x="1176" y="159">Not secret</text>
<rect class="item-un" x="385" y="327" width="150" height="36" rx="18"/><text class="small" x="460" y="349" text-anchor="middle">public key block</text>
<line class="arr-un" x1="460" y1="261" x2="460" y2="324" marker-end="url(#h-un)"/>
<line class="arr-un" x1="460" y1="363" x2="460" y2="426" marker-end="url(#h-un)"/>
<rect class="item-tr" x="585" y="327" width="150" height="36" rx="18"/><text class="small" x="660" y="349" text-anchor="middle">fingerprint</text>
<line class="arr-tr" x1="660" y1="261" x2="660" y2="324" marker-end="url(#h-tr)"/>
<line class="arr-tr" x1="660" y1="363" x2="660" y2="426" marker-end="url(#h-tr)"/>
<rect class="item-un" x="785" y="327" width="150" height="36" rx="18"/><text class="small" x="860" y="349" text-anchor="middle">message block</text>
<line class="arr-un" x1="860" y1="429" x2="860" y2="366" marker-end="url(#h-un)"/>
<line class="arr-un" x1="860" y1="327" x2="860" y2="264" marker-end="url(#h-un)"/>
<rect class="item-tr" x="1185" y="327" width="150" height="36" rx="18"/><text class="small" x="1260" y="349" text-anchor="middle">confirmation</text>
<line class="arr-tr" x1="1260" y1="261" x2="1260" y2="324" marker-end="url(#h-tr)"/>
<line class="arr-tr" x1="1260" y1="363" x2="1260" y2="426" marker-end="url(#h-tr)"/>
<rect class="action" x="180" y="209" width="160" height="52" rx="6"/>
<text class="small" x="260" y="231" text-anchor="middle">Make key pair,</text><text class="small" x="260" y="247" text-anchor="middle">set passphrase</text>
<rect class="action" x="380" y="209" width="160" height="52" rx="6"/>
<text class="small" x="460" y="239" text-anchor="middle">Show public key</text>
<rect class="action" x="380" y="429" width="160" height="52" rx="6"/>
<text class="small" x="460" y="459" text-anchor="middle">Save as friend.pub</text>
<rect class="action" x="580" y="209" width="160" height="52" rx="6"/>
<text class="small" x="660" y="231" text-anchor="middle">Read fingerprint</text><text class="small" x="660" y="247" text-anchor="middle">aloud</text>
<rect class="action" x="580" y="429" width="160" height="52" rx="6"/>
<text class="small" x="660" y="451" text-anchor="middle">Check it matches</text><text class="small" x="660" y="467" text-anchor="middle">the screen</text>
<rect class="action" x="780" y="429" width="160" height="52" rx="6"/>
<text class="small" x="860" y="451" text-anchor="middle">Type secret at</text><text class="small" x="860" y="467" text-anchor="middle">hidden prompt</text>
<rect class="action" x="780" y="209" width="160" height="52" rx="6"/>
<text class="small" x="860" y="239" text-anchor="middle">Receive it</text>
<rect class="action" x="980" y="209" width="160" height="52" rx="6"/>
<text class="small" x="1060" y="231" text-anchor="middle">Enter passphrase,</text><text class="small" x="1060" y="247" text-anchor="middle">secret to clipboard</text>
<rect class="action" x="1180" y="209" width="160" height="52" rx="6"/>
<text class="small" x="1260" y="231" text-anchor="middle">Ask: did you</text><text class="small" x="1260" y="247" text-anchor="middle">send this?</text>
<rect class="action" x="1180" y="429" width="160" height="52" rx="6"/>
<text class="small" x="1260" y="459" text-anchor="middle">Answer: yes</text>
</svg>
